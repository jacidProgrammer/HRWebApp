# H2 profile (default): in-memory database for local development.
# Schema is created by Hibernate on startup and dropped on shutdown, then seeded from import-h2.sql.
spring.config.activate.on-profile=h2

spring.datasource.url=jdbc:h2:mem:hrApplication
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=123

# H2 web console (http://localhost:8080/h2-console), only available in this profile
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Dev convenience: log the SQL Hibernate runs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Data initialization: run import-h2.sql after Hibernate has created the schema
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:import-h2.sql
