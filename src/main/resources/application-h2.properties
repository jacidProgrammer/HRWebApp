# H2 profile (default): in-memory database for local development.
# Flyway creates the schema on every start and DemoDataSeeder fills it; everything is lost on shutdown.
spring.config.activate.on-profile=h2

spring.datasource.url=jdbc:h2:mem:hrApplication
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=123

# H2 web console (http://localhost:8080/h2-console), only available in this profile
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Dev convenience: log the SQL Hibernate runs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
