# Container profile, activated by the Docker image (SPRING_PROFILES_ACTIVE=postgres,container).
# Datasource, issuer and JWKS URLs come from environment variables (see docker-compose.yml).
spring.config.activate.on-profile=container

# One JSON object per log line (Elastic Common Schema), with the requestId from the MDC
logging.structured.format.console=ecs
logging.structured.ecs.service.name=hr-api

# Actuator on its own port, which is only published to the internal Docker network:
# Prometheus scrapes /actuator/prometheus there without a token, and the image health check calls /actuator/health.
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus

spring.jpa.show-sql=false
