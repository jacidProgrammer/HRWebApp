# PostgreSQL profile: persistent database (docker compose service "hrapp-postgres").
spring.config.activate.on-profile=postgres

spring.datasource.url=jdbc:postgresql://localhost:5433/hrApplication
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=hrApplication
spring.datasource.password=hrApplication

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Schema and data lifecycle:
#  1. Flyway applies the pending migrations from db/migration on startup (history in flyway_schema_history).
#  2. Hibernate validates the entities against that schema (ddl-auto=validate, shared configuration).
#  3. DemoDataSeeder inserts the demo data only while the employees table is empty, so data survives restarts.
# A database created by the v1 application (Hibernate-generated, numeric ids) is refused by Flyway:
# recreate it with `docker compose down -v`.
