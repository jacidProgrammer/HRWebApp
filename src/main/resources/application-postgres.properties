# PostgreSQL profile: persistent database (docker compose service "hrapp-postgres").
spring.config.activate.on-profile=postgres

spring.datasource.url=jdbc:postgresql://localhost:5433/hrApplication
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=hrApplication
spring.datasource.password=hrApplication

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Schema and data lifecycle:
#  1. Hibernate creates missing tables/columns on startup and never drops data (ddl-auto=update).
#  2. defer-datasource-initialization makes the SQL init run *after* Hibernate, so the tables exist.
#  3. import-postgres.sql runs on every startup (mode=always) but is idempotent: it only inserts the
#     sample employees/feedback when those tables are empty, so data survives restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:import-postgres.sql
