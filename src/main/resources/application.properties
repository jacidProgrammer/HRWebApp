# HR Application - shared configuration
spring.profiles.active=h2

spring.application.name=HR Application

# SQL logging is off by default; the h2 (dev) profile turns it on.
spring.jpa.show-sql=false

# Schema: Flyway migrations (src/main/resources/db/migration) create and evolve the tables in every profile;
# Hibernate only checks that the entities match them.
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Demo employees and feedback, inserted on startup only while the employees table is empty
# (see DemoDataSeeder). Disabled in the prod build.
app.seed.demo-data=true

# Management endpoints (from actuator). Only /actuator/health is public, the rest needs a token.
# /actuator/prometheus is only public on a separate management port (see application-container.properties).
management.endpoints.web.exposure.include=health,info,env,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=hr-api
# Latency histograms for the HTTP server metrics (Grafana computes p50/p95/p99 from them)
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Request correlation id (RequestIdFilter) in every plain-text log line
logging.pattern.correlation=[%X{requestId:-}]\u0020

# OpenAPI: deterministic output (docs/openapi.json is compared with it in the build) and only the error
# responses each operation documents, instead of every @ExceptionHandler on every operation
springdoc.writer-with-order-by-keys=true
springdoc.override-with-generic-response=false
springdoc.default-produces-media-type=application/json
# OpenAPI 3.0: nullable fields as `nullable: true`, understood by every client generator
springdoc.api-docs.version=openapi_3_0

# OAuth2 Resource Server (Keycloak realm from realm-export/hr-realm.json)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8082/realms/hr-realm

# CORS: browser origins allowed to call the API (comma-separated), e.g. the HRWebApp-UI dev server.
# Override with the CORS_ALLOWED_ORIGINS environment variable.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Hugging Face sentiment analysis. Never commit a token: export HUGGINGFACE_TOKEN instead.
# Without a token (or when a manager disables it in /settings), feedback is stored without sentiment.
huggingface.token=${HUGGINGFACE_TOKEN:}
huggingface.model=cardiffnlp/twitter-roberta-base-sentiment-latest
huggingface.timeout=30s
