# Test profile, used by the Spring Boot tests (@ActiveProfiles("test")).
# No datasource URL on purpose: Spring Boot starts an embedded in-memory H2 database with a
# unique name per application context. The PostgreSQL adapters are covered separately by the
# Testcontainers integration test (see README).
spring.jpa.hibernate.ddl-auto=create-drop

# Data initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:import-h2.sql

# Never call the real Hugging Face API from tests
huggingface.token=
