name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit + Spring tests (including the OpenAPI contract check against docs/openapi.json), then the
      # Testcontainers PostgreSQL integration tests (the runner has Docker), then the JaCoCo report.
      - name: Build and test
        run: ./mvnw -B verify -Pintegration-tests

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds the production image to catch Dockerfile regressions; nothing is pushed.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: hrwebapp-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs as a non-root user
        run: test "$(docker image inspect hrwebapp-api:ci --format '{{.Config.User}}')" = "spring:spring"

  # Publishes the coverage badges to the orphan branch "badges" (one commit, force-pushed), so that main never
  # receives bot commits. Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
  coverage-badge:
    name: Coverage badge
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jacoco-report
          path: jacoco

      - name: Generate badges
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: jacoco/jacoco.csv
          badges-directory: badges
          generate-coverage-badge: true
          generate-branches-badge: true

      - name: Push to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd badges
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*.svg
          git commit -q -m "Coverage badges for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
